[package]
name = "premiere-hunter"
version = "0.2.0"
edition = "2021"
description = "Fast parallel search and media relink for Adobe Premiere Pro project files"
license = "MIT"

[dependencies]
walkdir = "2.4"
rayon = "1.8"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
flate2 = "1"
ctrlc = "3"
quick-xml = "0.31"
serde_json = "1.0"
dirs = "5.0"
