# Example configuration file for Premiere Hunter
# Usage: premiere-hunter --config path/to/config.yaml

search_text: "jock"

# %VAR% and $VAR / ${VAR} are expanded
paths:
  - "%USERPROFILE%/Documents"
  - "$HOME/Projects"

threads: 8

# Merge C:\ and D:\ (Windows) or home + mounts (Unix) with the paths above
auto_drives: false

extensions:
  - prproj

follow_links: false

# Skip projects larger than this on disk. Omit or 0 for no limit.
max_file_size_mb: 500

# Extra directory names to skip (merged with built-in system excludes)
exclude_dirs:
  - Archive
  - backup
  - cache
  - temp
